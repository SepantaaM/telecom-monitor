name: CI — Validate Stack

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validate Configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint healthcheck script
        run: |
          pip install flake8
          flake8 healthcheck.py --max-line-length=100

      - name: Validate docker-compose syntax
        run: docker compose config --quiet

      - name: Validate Prometheus config
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/prometheus:/etc/prometheus \
            prom/prometheus:latest \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Validate alert rules
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/prometheus:/etc/prometheus \
            prom/prometheus:latest \
            promtool check rules /etc/prometheus/alerts.yml

  integration-test:
    name: Integration Test — Stack Boots
    runs-on: ubuntu-latest
    needs: lint-and-validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          echo "GRAFANA_ADMIN_USER=admin" >> .env
          echo "GRAFANA_ADMIN_PASSWORD=testpassword" >> .env

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for services to be healthy
        run: |
          sleep 20
          docker compose ps

      - name: Test nginx health endpoint
        run: |
          curl -f http://localhost:8080/health || exit 1
          echo "Nginx health endpoint OK"

      - name: Test Prometheus is up
        run: |
          curl -f http://localhost:9090/-/healthy || exit 1
          echo "Prometheus is healthy"

      - name: Test Grafana is up
        run: |
          curl -f http://localhost:3000/api/health || exit 1
          echo "Grafana is healthy"

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
