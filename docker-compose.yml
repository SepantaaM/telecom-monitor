version: "3.8"

networks:
  monitor-net:
    driver: bridge

volumes:
  prometheus_data: {}
  grafana_data: {}

services:

  # Simulated telecom service (could be any internal API/service)
  nginx:
    image: nginx:alpine
    container_name: telecom-service
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    networks:
      - monitor-net
    restart: unless-stopped

  # Prometheus - metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "9090:9090"
    networks:
      - monitor-net
    restart: unless-stopped

  # Node Exporter - system metrics (CPU, RAM, disk)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    networks:
      - monitor-net
    pid: host
    restart: unless-stopped

  # Nginx Exporter - nginx metrics
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    command:
      - "-nginx.scrape-uri=http://nginx:80/stub_status"
    ports:
      - "9113:9113"
    networks:
      - monitor-net
    depends_on:
      - nginx
    restart: unless-stopped

  # Grafana - dashboards and alerting
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    networks:
      - monitor-net
    depends_on:
      - prometheus
    restart: unless-stopped

  # Health checker - custom Python alerting script
  healthcheck:
    build:
      context: .
      dockerfile: Dockerfile.healthcheck
    container_name: healthcheck
    environment:
      - TARGETS=http://nginx:80,http://prometheus:9090/-/healthy
      - CHECK_INTERVAL=${CHECK_INTERVAL:-30}
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-5}
      - ALERT_WEBHOOK=${ALERT_WEBHOOK:-}
    networks:
      - monitor-net
    depends_on:
      - nginx
      - prometheus
    restart: unless-stopped
