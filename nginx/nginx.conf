server {
    listen 80;
    server_name localhost;

    # Health endpoint
    location /health {
        return 200 '{"status":"ok","service":"telecom-monitor"}';
        add_header Content-Type application/json;
    }

    # Metrics endpoint (required by nginx-prometheus-exporter)
    location /stub_status {
        stub_status on;
        allow 172.0.0.0/8;   # Docker network
        deny all;
    }

    # Main app
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
